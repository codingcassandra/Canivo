# Render Blueprint: New > Blueprint in the Render dashboard, pick this repo.
services:
  - type: web
    name: canivo
    runtime: go
    plan: free
    buildCommand: go build -o bin/server ./cmd/server
    startCommand: ./bin/server
    healthCheckPath: /health
    envVars:
      - key: API_KEY
        generateValue: true # Render creates a random secret; copy it from the Environment tab
      - key: DATABASE_URL
        sync: false # paste your Supabase connection string when prompted
      - key: VAPID_PUBLIC_KEY
        sync: false # from: go run ./cmd/vapidkeys
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false # your email, e.g. you@example.com
      - key: ALLOWED_ORIGINS
        sync: false # the web app URL, e.g. https://canivo.vercel.app
